[project]
name = "cs2trader"
version = "0.1.0"
description = "Research backtester for CS2 skin trading on market.csgo"
requires-python = ">=3.14"
dependencies = [
    "duckdb==2.0.0",
    "polars==2.1.0",
    "pyarrow==26.0.1",
    "httpx==0.28.1",
    "brotli==1.2.1",
]

[project.scripts]
cs2 = "cs2trader.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs2trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
